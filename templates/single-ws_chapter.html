	<!-- wp:columns {"align":"wide","className":"ws-profile__hero","style":{"spacing":{"blockGap":{"left":"var:preset|spacing|60"}}}} -->

			<!-- wp:html -->
			<div class="ws-profile__kicker">[ws_chapter_meta]</div>

			<!-- wp:post-title {"level":1,"style":{"typography":{"fontSize":"clamp(2.25rem, 5vw, 3.75rem)","textTransform":"uppercase"}}} /-->

			</div>
